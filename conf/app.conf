[dev]
mode.dev = true
results.pretty = true
watch = true
watcher.mode = 'normal'
module.testrunner = github.com/revel/modules/testrunner

log.all.filter.module.app = stdout
log.error.nfilter.module.app = stderr
log.crit.output = stderr
log.request.output = stdout

[prod]
# Revel 1.x は http.addr が空だと localhost のみで待ち受けるため、コンテナ外から接続できるよう明示する
http.addr = 0.0.0.0
mode.dev = false
results.pretty = false
watch = false
module.testrunner =

log.info.output  = conf/%(app.name)s.log
log.warn.output  = conf/%(app.name)s.log
log.error.output = conf/%(app.name)s.log
log.crit.output  = conf/%(app.name)s.log
log.request.output = conf/%(app.name)s-requests.json

