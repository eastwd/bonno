{{set . "title" ""}}
{{template "header.html" .}}

{{if .topmoviepath}}
<a href="{{url "App.Index" }}">
    <video id="top-video" autoplay controls loop width=100% height=100%>
    <source src="{{.topmoviepath}}">
    </video>
</a>
{{else}}
<div class="jumbotron text-center">
    <p>トップ動画が登録されていません</p>
    <a class="btn btn-primary btn-lg" href="{{url "App.Index" }}">ホームへ</a>
</div>
{{end}}

{{template "footer.html" .}}
